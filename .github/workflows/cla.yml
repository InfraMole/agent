# SPDX-License-Identifier: AGPL-3.0-only
# Contributor License Agreement check (CLA.md). A contributor accepts it once
# by commenting the sentence below on a pull request; signatures are kept in
# the "cla-signatures" branch of this repository. Pull request code is never
# checked out or run here.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      # contributor-assistant/github-action v2.6.1 (Apache-2.0), pinned by commit.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/cla-v1.json
          branch: cla-signatures
          allowlist: dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thank you for your contribution! Before we can merge it, please read the
            [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md)
            and accept it by posting the comment below. You only need to do this once.
          custom-allsigned-prcomment: All contributors have accepted the CLA. Thank you!
